# Nginx for Internet Speed - one domain, one certificate.
# The speed test widget is served by OpenSpeedTest, so no heavy proxying here.
# Replace the domain name below with your own.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name speed.example.com;

    ssl_certificate     /etc/letsencrypt/live/speed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speed.example.com/privkey.pem;
    include /etc/nginx/snippets/ssl-common.conf;

    access_log /var/log/nginx/internet-speed.access.log;
    error_log  /var/log/nginx/internet-speed.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pi payments create a blockchain transaction and wait for it. The default
    # 60s read timeout can cut that off midway, which leaves a payout looking
    # stuck even though the server is still working.
    location ~ ^/api/(admin/rewards|rewards/claim|payments)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name speed.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
