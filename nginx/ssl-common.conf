# Put this at /etc/nginx/snippets/ssl-common.conf
#
# /etc/letsencrypt/options-ssl-nginx.conf is created only by certbot's nginx
# plugin. If the certificate is obtained with "certonly --standalone" that file
# never exists and nginx fails to start. This provides the same settings
# independently of certbot.

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_timeout       1d;
ssl_session_cache         shared:SSL:10m;
ssl_session_tickets       off;

# ssl_dhparam is not needed: no DHE cipher is listed above.

# Optional, once HTTPS is known to be stable. Browsers will then refuse plain
# HTTP for this domain for a year.
# add_header Strict-Transport-Security "max-age=31536000" always;
